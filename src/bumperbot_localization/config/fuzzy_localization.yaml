fuzzy_localization_node:
  ros__parameters:
    use_sim_time: true
    ann_topic: /odometry/ann
    kf2_topic: /odometry/kf_gps_odom
    odom_topic: /bumperbot_controller/odom_noisy
    imu_topic: /imu_sim
    output_topic: /odometry/fuzzy_localization
    frequency: 20.0
    small_error: 0.22
    large_error: 0.30
    ann_weight_zero: 0.0
    ann_weight_small: 0.02
    ann_weight_large: 1.0
    max_integrated_imu_speed: 2.0
    imu_velocity_decay_tau: 12.0
    imu_velocity_odom_correction_tau: 4.0
    imu_velocity_correction_gate: 1.2
    output_variance: 0.25
    save_log: true
    log_path: ~/bumperbot_ws/src/fuzzy_localization_log.csv
