fuzzy_localization_node:
  ros__parameters:
    use_sim_time: true
    ann_topic: /odometry/ann
    kf2_topic: /odometry/kf_gps_odom
    gps_hold_topic: /odometry/gps_hold
    odom_topic: /bumperbot_controller/odom_noisy
    imu_topic: /imu_sim
    output_topic: /odometry/fuzzy_localization
    frequency: 20.0
    small_error: 0.12
    large_error: 0.38
    ann_weight_zero: 0.0
    ann_weight_small: 0.35
    ann_weight_large: 1.0
    defuzzification_method: weighted_average
    cog_resolution: 201
    adaptive_error_enabled: true
    adaptive_error_mode: excess
    adaptive_baseline_tau: 5.0
    adaptive_min_baseline: 0.05
    adaptive_min_odom_speed: 0.10
    adaptive_freeze_after_sec: 24.0
    adaptive_deadband_ratio: 0.03
    velocity_error_source: corrected
    use_normalized_velocity_error: false
    min_velocity_norm_for_error: 0.15
    max_integrated_imu_speed: 2.0
    raw_imu_velocity_decay_tau: 10.0
    imu_velocity_decay_tau: 12.0
    imu_velocity_odom_correction_tau: 4.0
    imu_velocity_correction_gate: 1.2
    alpha_rise_tau: 0.08
    alpha_fall_tau: 0.80
    slip_latch_enabled: true
    slip_latch_trigger_error: 0.20
    slip_latch_release_error: 0.02
    slip_latch_hold_sec: 35.0
    slip_latch_ann_weight: 0.0
    slip_latch_alpha_cap_enabled: true
    slip_latch_alpha_cap: 0.25
    slip_latch_force_ann_enabled: true
    slip_latch_force_ann_alpha: 1.0
    slip_latch_force_ann_requires_gps_unreliable: true
    severe_slip_boost_enabled: true
    severe_slip_disagreement: 3.0
    severe_slip_disagreement_rate: 0.25
    severe_slip_min_fuzzy_error: 0.0
    severe_slip_ann_weight: 0.95
    severe_slip_boost_requires_gps_unreliable: true
    gps_trust_gate_enabled: true
    gps_hold_unreliable_variance_threshold: 5.0
    gps_unreliable_hold_sec: 2.0
    gps_reliable_alpha_cap_enabled: true
    gps_reliable_alpha_cap: 0.0
    gps_reliable_selector_enabled: true
    gps_reliable_selector_margin: 0.05
    gps_reliable_selector_ann_alpha: 1.0
    gps_reliable_selector_tie_alpha_cap: 0.25
    disagreement_boost_enabled: false
    disagreement_small: 0.75
    disagreement_large: 1.05
    disagreement_min_velocity_error: 1.75
    output_variance: 0.25
    save_log: true
    log_path: /home/alex/EKF-and-ANN/src/fuzzy_localization_log.csv
